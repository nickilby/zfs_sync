# Alembic configuration.
#
# The database URL is deliberately not set here: alembic/env.py reads it from
# the application settings, so migrations and the running service can never
# disagree about which database they are pointed at. Override for a one-off run
# with `alembic -x db_url=... upgrade head`.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Revision filenames are prefixed with their number so that `ls` shows the
# chain in order. The number is cosmetic; `down_revision` defines the order.
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
